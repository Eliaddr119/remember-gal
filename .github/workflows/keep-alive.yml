name: Keep Supabase alive

on:
  schedule:
    - cron: "0 8 * * *"  # every day at 08:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_URL }}/api/keep-alive")
          echo "Response: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
