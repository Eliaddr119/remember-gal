name: Keep Supabase alive

on:
  schedule:
    - cron: "0 8 * * *"  # every day at 08:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          # URL is hardcoded (public site) so this no longer depends on a
          # PROD_URL secret. -L follows redirects; --retry rides out transient
          # blips (cold starts, brief network errors) instead of emailing a
          # failure. Only a real, repeated non-2xx fails the job.
          STATUS=$(curl -sS -L \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -o /dev/null -w "%{http_code}" \
            "https://for-gal.up.railway.app/api/keep-alive")
          echo "Response: $STATUS"
          case "$STATUS" in
            2*) echo "Keep-alive OK" ;;
            *) echo "Keep-alive failed with status $STATUS"; exit 1 ;;
          esac
