[build]
builder = "NIXPACKS"

[deploy]
# Cap V8's old-space heap. Railway reports the host's large RAM to Node, so
# without this V8 grows its heap and delays GC, inflating RSS. 512 MB is plenty
# for this SSR app (JS heap stays well under that); sharp uses native memory
# outside the V8 heap, so this won't cause upload OOMs.
startCommand = "NODE_OPTIONS='--max-old-space-size=512' npm run start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
